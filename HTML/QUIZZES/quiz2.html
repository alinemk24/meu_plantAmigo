<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="../../CSS/style.css">

    <title>Quiz 2 - Água e umidade</title>

</head>


<body>


    <header>

        <a href="../LICOES/licao2.html" class="voltar">
            ← Lição
        </a>

        <h1 class="titulo">
            Meu PlantAmigo
        </h1>

    </header>



    <main class="quiz">


        <!-- CABEÇALHO DO QUIZ -->

        <section class="cabecalhoQuiz">

            <div class="progressoQuiz">

                <div
                    id="progressoBarra"
                    class="progressoBarra">
                </div>

            </div>


            <span class="numeroQuiz">

                Pergunta
                <span id="numeroPergunta">1</span>
                de 5

            </span>


            <span class="pontosQuiz">

                ⭐
                <span id="pontosQuiz">0</span>

            </span>

        </section>



        <!-- PERGUNTA -->

        <section class="perguntaQuiz">

            <h2 id="pergunta">

                Por que a água é importante para as plantas?

            </h2>


            <div class="opcoesQuiz">

                <button
                    class="opcaoQuiz"
                    type="button"
                    data-resposta="A">

                    Porque todas as plantas vivem dentro da água

                </button>


                <button
                    class="opcaoQuiz"
                    type="button"
                    data-resposta="B">

                    Porque ajuda a planta a se manter hidratada e a transportar substâncias

                </button>


                <button
                    class="opcaoQuiz"
                    type="button"
                    data-resposta="C">

                    Porque substitui a luz do Sol

                </button>


                <button
                    class="opcaoQuiz"
                    type="button"
                    data-resposta="D">

                    Porque faz a planta produzir flores

                </button>

            </div>

        </section>



        <!-- FEEDBACK -->

        <section
            id="feedbackQuiz"
            class="feedbackQuiz">

            <h3 id="tituloFeedback"></h3>

            <p id="textoFeedback"></p>

        </section>



        <!-- PRÓXIMA PERGUNTA -->

        <button
            id="btnProxima"
            class="btnProxima"
            type="button">

            Próxima

        </button>



        <!-- RESULTADO FINAL -->

        <section
            id="resultadoQuiz"
            class="resultadoQuiz">


            <div class="resultadoMascote">

                💧

            </div>


            <h2>
                Quiz concluído!
            </h2>


            <p id="mensagemResultado">

                Você terminou o quiz!

            </p>


            <div class="pontuacaoFinal">

                <span>
                    Você ganhou
                </span>


                <strong>

                    ⭐
                    <span id="pontosFinais">0</span>
                    pontos

                </strong>

            </div>


            <a
                href="../aprender.html"
                class="btnContinuar">

                Continuar

            </a>

        </section>


    </main>



    <script src="../../JS/QUIZZES/quiz2.js"></script>


</body>

</html>
